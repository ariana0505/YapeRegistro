{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Registro de pagos{% endblock %} · Minimarket Celia</title>
  <link rel="stylesheet" href="{% static 'payments/app.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{% url 'payment-list' %}"><span class="brand-mark">S/</span><span>Minimarket <strong>Celia</strong></span></a>
      {% if user.is_authenticated %}
      <nav aria-label="Navegación principal">
        <a href="{% url 'payment-list' %}">Pagos</a>
        <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="text-button" type="submit">Salir</button></form>
      </nav>
      {% endif %}
    </div>
  </header>
  <main class="container">
    {% if messages %}<div class="messages" aria-live="polite">{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
