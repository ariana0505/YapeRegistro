name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DJANGO_SECRET_KEY: ci-only-non-production-key
      DJANGO_DEBUG: 'true'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://yaperegistro:ci-only-password@127.0.0.1:5432/yaperegistro
    steps:
      - uses: actions/checkout@v7
      - name: Iniciar PostgreSQL local del runner
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE ROLE yaperegistro LOGIN CREATEDB PASSWORD 'ci-only-password';"
          sudo -u postgres createdb -O yaperegistro yaperegistro
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
